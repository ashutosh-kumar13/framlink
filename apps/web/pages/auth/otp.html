<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmLink AI — OTP सत्यापन</title>
    <link rel="stylesheet" href="../../shared/assets/css/design-system.css" />
    <link rel="stylesheet" href="../../shared/assets/css/components.css" />
    <link rel="stylesheet" href="../../shared/assets/css/compact-ui.css" />
    <link rel="stylesheet" href="../../shared/assets/css/style.css" />
  </head>
  <body>
    <!-- Top Header Bar -->
    <header class="auth-header">
      <div class="header-left">
        <div class="logo-wrap">
          <span class="logo-icon"><i data-lucide="leaf"></i></span>
          <div class="logo-text">
            <span class="brand-title"
              >FarmLink <span class="ai-text">AI</span></span
            >
            <span class="brand-sub">सीधी किसान सेवा</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Split Container -->
    <div class="auth-wrap split-new">
      <!-- Left Side Content -->
      <div class="auth-left-new">
        <!-- Agriculture Illustration -->
        <div class="illustration-container">
          <img
            src="../../shared/assets/images/login_illustration.jpg"
            alt="FarmLink AI Smart Mandi"
          />
        </div>

        <!-- Green Footer Banner -->
        <div class="bottom-green-banner">
          किसानों, एफपीओ, खरीदारों और स्थानीय समुदायों के लिए बनाया गया है।<br />
          विश्वास के साथ व्यापार करें, साथ मिलकर आगे बढ़ें।
        </div>
      </div>

      <!-- Right Side OTP Verification Card -->
      <div class="auth-right-new">
        <div class="card-welcome">
          <div class="icon-circle-welcome">
            <i data-lucide="shield-alert"></i>
          </div>
          <h1>OTP सत्यापन करें</h1>
          <div class="subtitle" style="margin-bottom: 12px">
            Verify the OTP sent to
          </div>
          <p
            style="
              text-align: center;
              margin-bottom: 22px;
              font-weight: 600;
              color: var(--ink);
            "
          >
            <span id="display-number">98765 43210</span> ·
            <a
              href="../../../../login.html"
              style="color: var(--primary-light); text-decoration: underline"
              >बदलें</a
            >
          </p>

          <form id="otpForm" novalidate>
            <div id="recaptcha-container"></div>
            <div class="field">
              <label
                style="
                  font-weight: 600;
                  font-size: 13.5px;
                  color: #1e293b;
                  display: block;
                  margin-bottom: 10px;
                "
                >6 अंकों का OTP डालें</label
              >
              <div class="input-otp" id="otpBoxes" style="margin-bottom: 20px">
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
              </div>
              <div
                class="error-msg"
                id="otpErr"
                style="
                  display: none;
                  justify-content: center;
                  margin-bottom: 16px;
                "
              >
                ⚠ OTP गलत है, फिर से कोशिश करें
              </div>
            </div>

            <button
              type="submit"
              class="btn-auth-submit"
              style="margin-bottom: 12px"
            >
              सत्यापित करें &nbsp;&rarr;
            </button>
            <button
              type="button"
              class="btn-outline-reg"
              id="resendBtn"
              style="padding: 10px 20px; font-size: 13px"
            >
              OTP फिर से भेजें (00:30)
            </button>
          </form>

          <div class="contact-note" style="margin-top: 36px">
            सहायता चाहिए? कॉल करें <strong>1800-XXX-XXXX</strong>
          </div>
        </div>
      </div>
    </div>

    <script src="../../shared/assets/js/app.js?v=otp-demo-2"></script>
    <script src="../../shared/assets/js/ui.js"></script>
    <script>
      wireOtpInputs("#otpBoxes input");
      const savedPhone = sessionStorage.getItem("farmlink_phone") || "";
      const otpError = document.getElementById("otpErr");
      document.getElementById("display-number").textContent =
        savedPhone.replace(/^\+91/, "");
      let otpRequest = (async () => {
        await window.firebaseScriptReady;
        if (!savedPhone) throw new Error("मोबाइल नंबर नहीं मिला।");
        return requestFirebasePhoneOtp(savedPhone, "recaptcha-container");
      })();
      document
        .getElementById("otpForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const vals = [...document.querySelectorAll("#otpBoxes input")].map(
            (i) => i.value,
          );
          const complete = vals.every((v) => v.length === 1);
          otpError.style.display = complete ? "none" : "flex";
          if (!complete) return;

          const submitButton = this.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          submitButton.textContent = "सत्यापन हो रहा है...";
          try {
            await otpRequest;
            await confirmFirebasePhoneOtp(vals.join(""));
            const client = await window.firebaseReady;
            const {
              data: { user },
            } = await client.auth.getUser();
            if (!user) throw new Error("यूज़र नहीं मिला।");

            const authenticatedPhone = user.phone || savedPhone;
            let { data: profile, error } = await client
              .from("users")
              .select("role, verified")
              .eq("id", user.id)
              .maybeSingle();
            if (error) throw error;
            if (!profile && authenticatedPhone) {
              ({ data: profile, error } = await client
                .from("users")
                .select("role, verified")
                .eq("phone_number", authenticatedPhone)
                .maybeSingle());
              if (error) throw error;
            }
            if (!profile)
              throw new Error("इस मोबाइल नंबर का प्रोफ़ाइल नहीं मिला।");

            sessionStorage.setItem("farmlink_phone", authenticatedPhone);
            if (profile.role === "buyer") {
              window.location.href = "../buyer/buyer-dashboard.html";
            } else if (profile.role === "farmer" || profile.role === "seller") {
              window.location.href = "../seller/seller-dashboard.html";
            } else {
              window.location.href = "../onboarding/role-selection.html";
            }
          } catch (error) {
            otpError.textContent = `⚠ OTP सत्यापन विफल: ${error.message}`;
            otpError.style.display = "flex";
            submitButton.disabled = false;
            submitButton.textContent = "सत्यापित करें →";
          }
        });
      let t = 30;
      const resend = document.getElementById("resendBtn");
      const timer = setInterval(() => {
        t--;
        if (t <= 0) {
          resend.textContent = "OTP फिर से भेजें";
          resend.disabled = false;
          clearInterval(timer);
        } else {
          resend.textContent = `OTP फिर से भेजें (00:${t.toString().padStart(2, "0")})`;
        }
      }, 1000);
      resend.disabled = true;
      resend.addEventListener("click", async () => {
        resend.disabled = true;
        try {
          otpRequest = requestFirebasePhoneOtp(
            savedPhone,
            "recaptcha-container",
          );
          await otpRequest;
          otpError.style.display = "none";
          t = 30;
          resend.textContent = "OTP फिर से भेजें (00:30)";
        } catch (error) {
          otpError.textContent = `⚠ OTP नहीं भेजा गया: ${error.message}`;
          otpError.style.display = "flex";
          resend.disabled = false;
        }
      });

      // Load Lucide Icons
      if (!window.lucide) {
        const lucideScript = document.createElement("script");
        lucideScript.src = "https://unpkg.com/lucide@latest";
        lucideScript.onload = () => {
          if (window.lucide) window.lucide.createIcons();
        };
        document.head.appendChild(lucideScript);
      } else {
        window.lucide.createIcons();
      }
    </script>
  </body>
</html>
