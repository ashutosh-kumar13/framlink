<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmLink AI — किसान पंजीकरण</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Top Header Bar -->
<header class="auth-header">
  <div class="header-left">
    <div class="logo-wrap">
      <span class="logo-icon"><i data-lucide="leaf"></i></span>
      <div class="logo-text">
        <span class="brand-title">FarmLink <span class="ai-text">AI</span></span>
        <span class="brand-sub">सीधी किसान सेवा</span>
      </div>
    </div>
  </div>
</header>

<!-- Centered Card Container -->
<div class="auth-centered-layout">
  <div class="auth-centered-card" style="max-width: 520px;">
    <h1 style="text-align:center;font-size:22px;margin-bottom:4px; font-weight: 700;">किसान पंजीकरण</h1>
    <p style="text-align:center;margin-bottom:24px;font-size:14px; color: #64748b;">Tell us a little about your farm</p>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="fname">पूरा नाम · Full name</label>
        <input type="text" id="fname" placeholder="जैसे रमेश कुमार" required style="border: 1.5px solid #cbd5e1;">
      </div>
      
      <div class="grid grid-2" style="gap:12px; grid-template-columns: 1fr 1fr;">
        <div class="field">
          <label for="state">राज्य · State</label>
          <select id="state" required style="border: 1.5px solid #cbd5e1;">
            <option value="">चुनें</option>
            <option>Uttar Pradesh</option>
            <option>Punjab</option>
            <option>Haryana</option>
            <option>Madhya Pradesh</option>
          </select>
        </div>
        <div class="field">
          <label for="dist">ज़िला · District</label>
          <input type="text" id="dist" placeholder="जैसे लखनऊ" required style="border: 1.5px solid #cbd5e1;">
        </div>
      </div>
      
      <div class="field">
        <label for="village">गाँव / पता · Village / Address</label>
        <input type="text" id="village" placeholder="गाँव, तहसील" required style="border: 1.5px solid #cbd5e1;">
      </div>
      <div class="field">
        <label for="land">खेती का क्षेत्रफल (एकड़) · Land size (acres)</label>
        <input type="number" id="land" placeholder="जैसे 3.5" min="0" step="0.1" required style="border: 1.5px solid #cbd5e1;">
      </div>
      <div class="field">
        <label for="crops">मुख्य फसलें · Primary crops</label>
        <input type="text" id="crops" placeholder="जैसे गेहूं, धान, सरसों" style="border: 1.5px solid #cbd5e1;">
      </div>
      
      <button type="submit" class="btn-auth-submit" style="margin-top: 8px;">आगे बढ़ें &nbsp;&rarr;</button>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', function(e){
  e.preventDefault();
  let ok = true;
  ['fname','state','dist','village','land'].forEach(id=>{
    const el = document.getElementById(id);
    const bad = !el.value.trim();
    el.classList.toggle('invalid', bad);
    if (bad) ok = false;
  });
  if (ok) window.location.href = 'seller-kyc-intro.html';
});

// Load Lucide Icons
if (!window.lucide) {
  const lucideScript = document.createElement('script');
  lucideScript.src = 'https://unpkg.com/lucide@latest';
  lucideScript.onload = () => { if (window.lucide) window.lucide.createIcons(); };
  document.head.appendChild(lucideScript);
} else {
  window.lucide.createIcons();
}
</script>
</body>
</html>
