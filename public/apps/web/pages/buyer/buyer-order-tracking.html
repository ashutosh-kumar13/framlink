<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ऑर्डर ट्रैकिंग · KisanMandi</title>
    <link rel="stylesheet" href="../../shared/assets/css/design-system.css" />
    <link rel="stylesheet" href="../../shared/assets/css/components.css" />
    <link rel="stylesheet" href="../../shared/assets/css/compact-ui.css" />
    <link rel="stylesheet" href="../../shared/assets/css/style.css" />
  </head>
  <body>
    <div id="app-shell">
      <div class="main-col">
        <div id="topbar-slot"></div>
        <main class="content" style="max-width: 820px">
          <div class="breadcrumb">
            <a href="buyer-orders.html">मेरे ऑर्डर</a> / ट्रैकिंग
          </div>
          <h1 style="margin-bottom: 4px">ऑर्डर ट्रैकिंग</h1>
          <p style="margin-bottom: 18px">
            ऑर्डर <span class="mono">#ORD-2291</span> · गेहूं · 20 क्विंटल ·
            विक्रेता: रामेश कुमार
          </p>

          <div class="grid grid-2" style="align-items: start">
            <div class="card">
              <h2 style="margin-bottom: 14px">डिलीवरी स्थिति</h2>
              <div
                id="trackingSteps"
                style="display: flex; flex-direction: column"
              ></div>
            </div>

            <div class="card">
              <h2 style="margin-bottom: 14px">डिलीवरी विवरण</h2>
              <div
                style="
                  display: flex;
                  align-items: center;
                  gap: 12px;
                  margin-bottom: 14px;
                "
              >
                <div
                  class="avatar"
                  style="background: var(--soil-tint); color: var(--soil)"
                >
                  SY
                </div>
                <div>
                  <strong>सुनील यादव</strong>
                  <p style="margin: 0; font-size: 12.5px">वाहन: UP32 AB 4521</p>
                </div>
              </div>
              <div class="divider"></div>
              <p style="font-size: 13px; margin-bottom: 2px">
                <strong>पहुँचाने का पता</strong>
              </p>
              <p style="font-size: 13px">
                अग्रवाल ट्रेडर्स, सिविल लाइंस, लखनऊ - 226001
              </p>
              <div style="display: flex; gap: 8px; margin-top: 12px">
                <button class="btn btn-secondary btn-sm" style="flex: 1">
                  📞 डिलीवरी को कॉल करें
                </button>
                <a
                  href="../seller/help-center.html"
                  class="btn btn-secondary btn-sm"
                  style="flex: 1"
                  >सहायता</a
                >
              </div>
            </div>
          </div>

          <!-- delivery completion state -->
          <div
            class="alert alert-success"
            style="display: none; margin-top: 16px"
          >
            ✓ ऑर्डर सफलतापूर्वक डिलीवर हो गया — विक्रेता को रेट करें
          </div>
        </main>
      </div>
    </div>
    <script src="../../shared/assets/js/app.js"></script>
    <script src="../../shared/assets/js/buyer-data.js"></script>
    <script src="../../shared/assets/js/ui.js"></script>
    <script>
      initShell("buyer", "orders", "ऑर्डर ट्रैकिंग");

      async function loadOrderTracking() {
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get("id");
        const summary = document.querySelector("main.content p");

        try {
          const order = orderId
            ? await window.farmlinkBuyerData.fetchBuyerOrderById(orderId)
            : null;
          if (!order) {
            summary.innerHTML = "ऑर्डर जानकारी उपलब्ध नहीं है।";
            return;
          }

          const sellerStatuses = await window.farmlinkBuyerData.fetchSellerOrderStatuses(order.id);
          const rank = { pending: 0, accepted: 1, picking: 2, shipped: 3, delivered: 4, cancelled: 0 };
          const sellerStage = sellerStatuses.length
            ? Math.min(...sellerStatuses.map((entry) => rank[entry.status] ?? 0))
            : (rank[order.order_status] ?? 0);
          const displayStatus = ["pending", "accepted", "picking", "shipped", "delivered"][sellerStage];
          const statusSteps = [
            { label: "ऑर्डर दिया गया", done: true },
            { label: "विक्रेता द्वारा पुष्टि", done: true },
            {
              label: "रास्ते में",
              done: sellerStage >= 1,
            },
            {
              label: "डिलीवर हो गया",
              done: sellerStage >= 4,
            },
          ];

          summary.innerHTML = `ऑर्डर <span class="mono">#${String(order.id).slice(0, 8)}</span> · ${window.farmlinkBuyerData.money(order.total_amount || 0)} · स्थिति: ${displayStatus}`;
          document.getElementById("trackingSteps").innerHTML = statusSteps
            .map(
              (step, index) => `
            <div style="display: flex; gap: 12px">
              <div style="display: flex; flex-direction: column; align-items: center;">
                <div style="width: 22px; height: 22px; border-radius: 50%; background: ${step.done ? "var(--success)" : "var(--line)"}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px;">${step.done ? "✓" : index + 1}</div>
                ${index < statusSteps.length - 1 ? '<div style="width: 2px; flex: 1; background: var(--success); min-height: 20px;"></div>' : ""}
              </div>
              <div style="padding-bottom: 14px;">
                <strong style="font-size: 13.5px">${step.label}</strong>
                <p style="margin: 2px 0 0; font-size: 12px">${step.done ? "पूरा" : "लंबित"}</p>
              </div>
            </div>
          `,
            )
            .join("");
        } catch (error) {
          console.error("Order tracking failed", error);
          summary.innerHTML = "ऑर्डर ट्रैकिंग डेटा उपलब्ध नहीं है।";
        }
      }

      loadOrderTracking();
    </script>
  </body>
</html>
