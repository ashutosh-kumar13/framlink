<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FarmLink AI — OTP सत्यापन</title>
    <link rel="stylesheet" href="../../shared/assets/css/design-system.css" />
    <link rel="stylesheet" href="../../shared/assets/css/components.css" />
    <link rel="stylesheet" href="../../shared/assets/css/compact-ui.css" />
    <link rel="stylesheet" href="../../shared/assets/css/style.css" />
  </head>
  <body>
    <!-- Top Header Bar -->
    <header class="auth-header">
      <div class="header-left">
        <div class="logo-wrap">
          <span class="logo-icon"><i data-lucide="leaf"></i></span>
          <div class="logo-text">
            <span class="brand-title"
              >FarmLink <span class="ai-text">AI</span></span
            >
            <span class="brand-sub">सीधी किसान सेवा</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Split Container -->
    <div class="auth-wrap split-new">
      <!-- Left Side Content -->
      <div class="auth-left-new">
        <!-- Agriculture Illustration -->
        <div class="illustration-container">
          <img
            src="../../shared/assets/images/login_illustration.jpg"
            alt="FarmLink AI Smart Mandi"
          />
        </div>

        <!-- Green Footer Banner -->
        <div class="bottom-green-banner">
          किसानों, एफपीओ, खरीदारों और स्थानीय समुदायों के लिए बनाया गया है।<br />
          विश्वास के साथ व्यापार करें, साथ मिलकर आगे बढ़ें।
        </div>
      </div>

      <!-- Right Side OTP Verification Card -->
      <div class="auth-right-new">
        <div class="card-welcome">
          <div class="icon-circle-welcome">
            <i data-lucide="shield-alert"></i>
          </div>
          <h1>OTP सत्यापन करें</h1>
          <div class="subtitle" style="margin-bottom: 12px">
            Verify the OTP sent to
          </div>
          <p
            style="
              text-align: center;
              margin-bottom: 22px;
              font-weight: 600;
              color: var(--ink);
            "
          >
            +91 98765 43210 ·
            <a
              href="../../../../login.html"
              style="color: var(--primary-light); text-decoration: underline"
              >बदलें</a
            >
          </p>

          <form id="otpForm" novalidate>
            <div class="field">
              <label
                style="
                  font-weight: 600;
                  font-size: 13.5px;
                  color: #1e293b;
                  display: block;
                  margin-bottom: 10px;
                "
                >6 अंकों का OTP डालें</label
              >
              <div class="input-otp" id="otpBoxes" style="margin-bottom: 20px">
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
                <input
                  type="text"
                  maxlength="1"
                  inputmode="numeric"
                  style="border: 1.5px solid #cbd5e1"
                />
              </div>
              <div
                class="error-msg"
                id="otpErr"
                style="
                  display: none;
                  justify-content: center;
                  margin-bottom: 16px;
                "
              >
                ⚠ OTP गलत है, फिर से कोशिश करें
              </div>
            </div>

            <button
              type="submit"
              class="btn-auth-submit"
              style="margin-bottom: 12px"
            >
              सत्यापित करें &nbsp;&rarr;
            </button>
            <button
              type="button"
              class="btn-outline-reg"
              id="resendBtn"
              style="padding: 10px 20px; font-size: 13px"
            >
              OTP फिर से भेजें (00:30)
            </button>
          </form>

          <div class="contact-note" style="margin-top: 36px">
            सहायता चाहिए? कॉल करें <strong>1800-XXX-XXXX</strong>
          </div>
        </div>
      </div>
    </div>

    <script src="../../shared/assets/js/app.js"></script>
    <script src="../../shared/assets/js/ui.js"></script>
    <script>
      wireOtpInputs("#otpBoxes input");
      document
        .getElementById("otpForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const vals = [...document.querySelectorAll("#otpBoxes input")].map(
            (i) => i.value,
          );
          const complete = vals.every((v) => v.length === 1);
          const otpError = document.getElementById("otpErr");
          otpError.style.display = complete ? "none" : "flex";
          if (!complete) return;
          window.location.href = "../onboarding/role-selection.html";
        });
      let t = 30;
      const resend = document.getElementById("resendBtn");
      const timer = setInterval(() => {
        t--;
        if (t <= 0) {
          resend.textContent = "OTP फिर से भेजें";
          resend.disabled = false;
          clearInterval(timer);
        } else {
          resend.textContent = `OTP फिर से भेजें (00:${t.toString().padStart(2, "0")})`;
        }
      }, 1000);
      resend.disabled = true;

      // Load Lucide Icons
      if (!window.lucide) {
        const lucideScript = document.createElement("script");
        lucideScript.src = "https://unpkg.com/lucide@latest";
        lucideScript.onload = () => {
          if (window.lucide) window.lucide.createIcons();
        };
        document.head.appendChild(lucideScript);
      } else {
        window.lucide.createIcons();
      }
    </script>
  </body>
</html>
