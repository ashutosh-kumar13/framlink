<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>चेकआउट · KisanMandi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <div class="main-col">
    <div id="topbar-slot"></div>
    <main class="content" style="max-width:900px;">

      <div class="breadcrumb"><a href="buyer-cart.html">कार्ट</a> / चेकआउट</div>
      <h1 style="margin-bottom:18px;">चेकआउट</h1>

      <div class="grid grid-2" style="align-items:start;">
        <div>
          <div class="card" style="margin-bottom:14px;">
            <h2 style="margin-bottom:12px;">डिलीवरी पता</h2>
            <div class="field"><label>पूरा पता</label><textarea placeholder="दुकान/गोदाम का पता, शहर, पिनकोड" required>अग्रवाल ट्रेडर्स, सिविल लाइंस, लखनऊ - 226001</textarea></div>
            <div class="grid grid-2">
              <div class="field"><label>संपर्क नंबर</label><input type="tel" value="+91 91234 56789"></div>
              <div class="field"><label>पिनकोड</label><input type="text" value="226001"></div>
            </div>
          </div>

          <div class="card" style="margin-bottom:14px;">
            <h2 style="margin-bottom:12px;">डिलीवरी तरीका</h2>
            <label class="checkbox-row" style="margin-bottom:10px;"><input type="radio" name="del" checked><span><strong>होम डिलीवरी</strong> — 2–3 दिन में · ₹450</span></label>
            <label class="checkbox-row"><input type="radio" name="del"><span><strong>स्वयं पिकअप</strong> — किसान के स्थान से · निःशुल्क</span></label>
          </div>

          <div class="card">
            <h2 style="margin-bottom:12px;">भुगतान तरीका</h2>
            <label class="checkbox-row" style="margin-bottom:10px;"><input type="radio" name="pay" checked><span><strong>UPI</strong></span></label>
            <label class="checkbox-row" style="margin-bottom:10px;"><input type="radio" name="pay"><span><strong>बैंक ट्रांसफर</strong></span></label>
            <label class="checkbox-row"><input type="radio" name="pay"><span><strong>डिलीवरी पर भुगतान (COD)</strong></span></label>
          </div>
        </div>

        <div class="card">
          <h2 style="margin-bottom:14px;">ऑर्डर सारांश</h2>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;"><span>गेहूं × 5 क्विंटल</span><span class="mono">₹10,900</span></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;"><span>सरसों × 2 क्विंटल</span><span class="mono">₹11,240</span></div>
          <div class="divider"></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;"><span>डिलीवरी शुल्क</span><span class="mono">₹450</span></div>
          <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;"><span>प्लेटफ़ॉर्म शुल्क</span><span class="mono">₹110</span></div>
          <div class="divider"></div>
          <div style="display:flex;justify-content:space-between;padding:4px 0;font-weight:700;font-size:16px;"><span>कुल राशि</span><span class="mono">₹22,700</span></div>
          <a href="buyer-order-tracking.html" class="btn btn-primary btn-block" style="margin-top:16px;">भुगतान करें और ऑर्डर करें</a>
          <p class="hint" style="text-align:center;margin-top:8px;">भुगतान करते ही आपको पुष्टि प्राप्त होगी</p>
        </div>
      </div>

    </main>
  </div>
</div>
<script src="js/app.js"></script>
<script>initShell('buyer','cart','चेकआउट');</script>
</body>
</html>
