<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>प्रोफाइल · KisanMandi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-shell">
  <div class="main-col">
    <div id="topbar-slot"></div>
    <main class="content" style="max-width:760px;">

      <h1 style="margin-bottom:4px;">प्रोफाइल</h1>
      <p style="margin-bottom:18px;">अपनी व्यक्तिगत व खाता जानकारी प्रबंधित करें</p>

      <div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:18px;">
        <div class="avatar" style="width:58px;height:58px;font-size:20px;">RK</div>
        <div style="flex:1;">
          <h2 style="margin-bottom:2px;">रामेश कुमार</h2>
          <p style="margin:0;font-size:13px;">+91 98765 43210 · लखनऊ, उत्तर प्रदेश</p>
        </div>
        <span class="badge-verified">✓ सत्यापित विक्रेता</span>
      </div>

      <div class="tabs">
        <a href="#" class="active">व्यक्तिगत जानकारी</a>
        <a href="#">खेत विवरण</a>
        <a href="#">भुगतान विवरण</a>
        <a href="#">सेटिंग्स</a>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <h2 style="margin-bottom:14px;">व्यक्तिगत जानकारी</h2>
        <div class="grid grid-2">
          <div class="field"><label>पूरा नाम</label><input type="text" value="रामेश कुमार"></div>
          <div class="field"><label>मोबाइल नंबर</label><input type="text" value="+91 98765 43210" disabled></div>
          <div class="field"><label>ईमेल (वैकल्पिक)</label><input type="email" placeholder="you@example.com"></div>
          <div class="field"><label>भाषा</label>
            <select><option>हिंदी</option><option>English</option></select>
          </div>
        </div>
        <button class="btn btn-primary">बदलाव सहेजें</button>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-title-row"><h2>सत्यापन स्थिति</h2></div>
        <div class="grid grid-2">
          <div class="stat"><div class="label">पहचान</div><span class="pill pill-success" style="margin-top:6px;"><span class="dot"></span>सत्यापित</span></div>
          <div class="stat"><div class="label">बैंक / UPI</div><span class="pill pill-success" style="margin-top:6px;"><span class="dot"></span>सत्यापित</span></div>
        </div>
      </div>

      <div class="card">
        <h2 style="margin-bottom:10px;">खाता कार्रवाई</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <a href="login.html" class="btn btn-secondary">लॉग आउट</a>
          <button class="btn btn-danger">खाता निष्क्रिय करें</button>
        </div>
      </div>

    </main>
  </div>
</div>
<script src="js/app.js"></script>
<script>initShell('seller','profile','प्रोफाइल');</script>
</body>
</html>
